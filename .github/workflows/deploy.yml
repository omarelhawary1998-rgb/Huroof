name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/blissful-brahmagupta-1ykioc]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Publishes the repo root to the gh-pages branch; GitHub auto-enables
      # Pages from that branch, so no manual settings change is needed.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
          cname: www.huroofartdesign.com
